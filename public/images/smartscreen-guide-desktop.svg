<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="100%" height="100%">
  <defs>
    <style>
      .win-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
      .win-desc { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; fill: #4b5563; line-height: 1.4; }
      .win-link { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #006259; text-decoration: underline; }
      .win-btn { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; }
      .step-badge { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #006259; }
      .step-note { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 10.5px; fill: #087d72; font-weight: 500; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="820" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== BƯỚC 1: MORE INFO ==================== -->
  <g transform="translate(24, 20)">
    <!-- Header Step 1 -->
    <rect x="0" y="0" width="70" height="22" rx="11" fill="#e6f5f3" stroke="#b2e2dc" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" class="step-badge">BƯỚC 1</text>
    <text x="80" y="16" class="step-note">Bấm "More info" để xem tùy chọn</text>

    <!-- Dialog 1 -->
    <g transform="translate(0, 32)" filter="url(#shadow)">
      <rect width="345" height="188" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Top banner / Accent bar -->
      <path d="M 0 10 Q 0 0 10 0 L 335 0 Q 345 0 345 10 L 345 6 L 0 6 Z" fill="#006259"/>
      
      <!-- Icon shield / alert -->
      <g transform="translate(18, 20)">
        <path d="M 10 0 L 20 4 L 20 12 Q 20 19 10 24 Q 0 19 0 12 L 0 4 Z" fill="#e0f2fe"/>
        <path d="M 10 2 L 18 5 L 18 12 Q 18 17 10 21 Q 2 17 2 12 L 2 5 Z" fill="#0284c7"/>
        <text x="10" y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">i</text>
      </g>

      <!-- Title -->
      <text x="46" y="36" class="win-title">Windows protected your PC</text>

      <!-- Description -->
      <text x="18" y="68" class="win-desc">Microsoft Defender SmartScreen prevented an</text>
      <text x="18" y="85" class="win-desc">unrecognized app from starting. Running this app</text>
      <text x="18" y="102" class="win-desc">might put your PC at risk.</text>

      <!-- Highlighted "More info" link -->
      <rect x="14" y="116" width="86" height="26" rx="6" fill="#e6f5f3" stroke="#006259" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="57" y="133" text-anchor="middle" class="win-link">More info</text>
      <!-- Click cursor hint -->
      <polygon points="105,133 117,143 111,144 115,153 111,155 107,146 102,150" fill="#006259" stroke="#ffffff" stroke-width="1"/>

      <!-- Footer Buttons -->
      <rect x="235" y="148" width="95" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="282" y="166" text-anchor="middle" class="win-btn" fill="#475569">Don't run</text>
    </g>
  </g>

  <!-- ==================== CONNECTOR ARROW ==================== -->
  <g transform="translate(390, 136)">
    <circle cx="20" cy="0" r="16" fill="#e6f5f3" stroke="#006259" stroke-width="1.5"/>
    <path d="M 14 0 L 24 0 M 20 -4 L 25 0 L 20 4" fill="none" stroke="#006259" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== BƯỚC 2: RUN ANYWAY ==================== -->
  <g transform="translate(450, 20)">
    <!-- Header Step 2 -->
    <rect x="0" y="0" width="70" height="22" rx="11" fill="#e6f5f3" stroke="#b2e2dc" stroke-width="1"/>
    <text x="35" y="15" text-anchor="middle" class="step-badge">BƯỚC 2</text>
    <text x="80" y="16" class="step-note">Chọn "Run anyway" để tiếp tục</text>

    <!-- Dialog 2 -->
    <g transform="translate(0, 32)" filter="url(#shadow)">
      <rect width="345" height="188" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Top banner / Accent bar -->
      <path d="M 0 10 Q 0 0 10 0 L 335 0 Q 345 0 345 10 L 345 6 L 0 6 Z" fill="#006259"/>

      <!-- Icon shield / alert -->
      <g transform="translate(18, 20)">
        <path d="M 10 0 L 20 4 L 20 12 Q 20 19 10 24 Q 0 19 0 12 L 0 4 Z" fill="#e0f2fe"/>
        <path d="M 10 2 L 18 5 L 18 12 Q 18 17 10 21 Q 2 17 2 12 L 2 5 Z" fill="#0284c7"/>
        <text x="10" y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">i</text>
      </g>

      <!-- Title -->
      <text x="46" y="36" class="win-title">Windows protected your PC</text>

      <!-- App details -->
      <text x="18" y="66" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">App:</text>
      <text x="55" y="66" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0f172a">Zalo.Clean.Setup.1.0.0-beta.7.exe</text>

      <text x="18" y="86" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">Publisher:</text>
      <text x="75" y="86" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">Unknown publisher</text>

      <line x1="18" y1="102" x2="327" y2="102" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Footer Action Buttons -->
      <!-- Highlighted "Run anyway" button in Zalo Clean teal -->
      <rect x="110" y="142" width="105" height="32" rx="6" fill="#006259" stroke="#004d46" stroke-width="1"/>
      <text x="162" y="162" text-anchor="middle" class="win-btn" fill="#ffffff">Run anyway</text>
      <!-- Click cursor hint on Run anyway -->
      <polygon points="220,158 232,168 226,169 230,178 226,180 222,171 217,175" fill="#006259" stroke="#ffffff" stroke-width="1"/>

      <!-- Don't run button -->
      <rect x="235" y="142" width="95" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="282" y="162" text-anchor="middle" class="win-btn" fill="#475569">Don't run</text>
    </g>
  </g>
</svg>
