<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" width="100%" height="100%">
  <defs>
    <style>
      .win-title-m { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #111827; }
      .win-desc-m { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; fill: #4b5563; line-height: 1.4; }
      .win-link-m { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #006259; text-decoration: underline; }
      .win-btn-m { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
      .step-badge-m { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #006259; }
      .step-note-m { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; fill: #087d72; font-weight: 500; }
    </style>
    <filter id="shadow-m" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="360" height="450" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- ==================== BƯỚC 1: MORE INFO ==================== -->
  <g transform="translate(16, 14)">
    <rect x="0" y="0" width="64" height="20" rx="10" fill="#e6f5f3" stroke="#b2e2dc" stroke-width="1"/>
    <text x="32" y="14" text-anchor="middle" class="step-badge-m">BƯỚC 1</text>
    <text x="74" y="15" class="step-note-m">Bấm "More info"</text>

    <!-- Dialog 1 -->
    <g transform="translate(0, 26)" filter="url(#shadow-m)">
      <rect width="328" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M 0 8 Q 0 0 8 0 L 320 0 Q 328 0 328 8 L 328 5 L 0 5 Z" fill="#006259"/>
      
      <!-- Shield icon -->
      <g transform="translate(14, 16)">
        <path d="M 8 0 L 16 3 L 16 9 Q 16 15 8 19 Q 0 15 0 9 L 0 3 Z" fill="#0284c7"/>
        <text x="8" y="13" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff">i</text>
      </g>
      <text x="36" y="29" class="win-title-m">Windows protected your PC</text>

      <text x="14" y="55" class="win-desc-m">Microsoft Defender SmartScreen prevented an</text>
      <text x="14" y="71" class="win-desc-m">unrecognized app from starting...</text>

      <!-- More info pill -->
      <rect x="12" y="86" width="80" height="24" rx="5" fill="#e6f5f3" stroke="#006259" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="52" y="102" text-anchor="middle" class="win-link-m">More info</text>
      <polygon points="98,100 108,108 103,109 106,116 103,117 100,110 96,113" fill="#006259"/>

      <!-- Don't run -->
      <rect x="232" y="114" width="84" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="274" y="131" text-anchor="middle" class="win-btn-m" fill="#475569">Don't run</text>
    </g>
  </g>

  <!-- ==================== CONNECTOR DOWN ARROW ==================== -->
  <g transform="translate(180, 212)">
    <circle cx="0" cy="0" r="13" fill="#e6f5f3" stroke="#006259" stroke-width="1.2"/>
    <path d="M 0 -6 L 0 5 M -4 1 L 0 6 L 4 1" fill="none" stroke="#006259" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== BƯỚC 2: RUN ANYWAY ==================== -->
  <g transform="translate(16, 238)">
    <rect x="0" y="0" width="64" height="20" rx="10" fill="#e6f5f3" stroke="#b2e2dc" stroke-width="1"/>
    <text x="32" y="14" text-anchor="middle" class="step-badge-m">BƯỚC 2</text>
    <text x="74" y="15" class="step-note-m">Chọn "Run anyway"</text>

    <!-- Dialog 2 -->
    <g transform="translate(0, 26)" filter="url(#shadow-m)">
      <rect width="328" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M 0 8 Q 0 0 8 0 L 320 0 Q 328 0 328 8 L 328 5 L 0 5 Z" fill="#006259"/>
      
      <!-- Shield icon -->
      <g transform="translate(14, 16)">
        <path d="M 8 0 L 16 3 L 16 9 Q 16 15 8 19 Q 0 15 0 9 L 0 3 Z" fill="#0284c7"/>
        <text x="8" y="13" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff">i</text>
      </g>
      <text x="36" y="29" class="win-title-m">Windows protected your PC</text>

      <text x="14" y="55" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">App:</text>
      <text x="44" y="55" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#0f172a">Zalo.Clean.Setup.1.0.0-beta.7.exe</text>

      <text x="14" y="73" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Publisher: Unknown publisher</text>

      <!-- Action buttons -->
      <rect x="116" y="114" width="102" height="30" rx="5" fill="#006259" stroke="#004d46" stroke-width="1"/>
      <text x="167" y="133" text-anchor="middle" class="win-btn-m" fill="#ffffff">Run anyway</text>
      <polygon points="222,128 231,136 227,137 230,143 227,144 224,138 220,141" fill="#006259"/>

      <rect x="232" y="114" width="84" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="274" y="133" text-anchor="middle" class="win-btn-m" fill="#475569">Don't run</text>
    </g>
  </g>
</svg>
